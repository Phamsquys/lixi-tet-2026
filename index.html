<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lì Xì Tết 2026</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    background:linear-gradient(180deg,#7a0000,#3a0a0a);
    color:#fff;
    min-height:100vh;
    font-family:'Segoe UI',system-ui;
}
h1{text-align:center;color:#e6c15a;margin:20px 0}
.app{max-width:1200px;margin:auto;padding:10px}
.top-bar{display:flex;justify-content:space-between;align-items:center}
button{
    background:linear-gradient(135deg,#ffd966,#ffb700);
    border:none;padding:10px 18px;border-radius:20px;
    font-weight:600;cursor:pointer
}
.main{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-top:20px}
@media(max-width:900px){.main{grid-template-columns:1fr}}

.envelopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:15px}
.envelope{
    height:150px;border-radius:12px;
    background:linear-gradient(135deg,#753939,#b30000);
    display:flex;align-items:center;justify-content:center;
    position:relative;cursor:pointer;
    box-shadow:0 8px 15px rgba(0,0,0,.4);
    transition:.3s
}
.envelope:hover{transform:translateY(-6px)}
.envelope.opened{animation:pop .6s forwards}
@keyframes pop{
    0%{transform:scale(1)}
    50%{transform:scale(1.3)}
    100%{transform:scale(0);opacity:0}
}

.lixi-text{
    position:absolute;width:100%;text-align:center;
    color:#e6c15a;font-weight:bold;pointer-events:none
}
.lixi-text.small{top:18px;font-size:12px;opacity:.7}
.lixi-text.big{font-size:21px;letter-spacing:1.5px}

.history{background:rgba(0,0,0,.25);border-radius:15px;padding:15px}
.history-item{
    background:rgba(255,255,255,.1);
    padding:8px;border-radius:10px;margin-bottom:8px
}

.modal{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    display:none;align-items:center;justify-content:center
}
.modal.show{display:flex}
.modal-box{
    background:linear-gradient(135deg,#6b0f0f,#3b0606);
    padding:25px;border-radius:20px;text-align:center;
    animation:zoom .4s
}
@keyframes zoom{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.modal input{width:100%;padding:10px;border-radius:10px;border:none;margin-top:10px}
.reward{font-size:24px;color:#f1d98b}
#fireworks{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1}
</style>
</head>

<body>
<canvas id="fireworks"></canvas>
<h1>🧧 NHẬN BAO LÌ XÌ MAY MẮN 🧧</h1>

<div class="app">
    <div class="top-bar">
        <button>Xáo bao lì xì</button>
        <div>Bao còn lại: <span id="count">0</span></div>
    </div>

    <div class="main">
        <div class="envelopes" id="envelopes"></div>
        <div class="history">
            <h3>Những người đã mở</h3>
            <div id="historyList"></div>
        </div>
    </div>
</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <div class="reward" id="rewardText"></div>
        <input id="nameInput" placeholder="Nhập tên người mở">
        <button onclick="confirmOpen()" style="margin-top:15px">Xác nhận</button>
    </div>
</div>

<script>
/* ===== SUPABASE ===== */
const sb = supabase.createClient(
  "https://emkehtsxkoyagcfybhxe.supabase.co",
  "sb_publishable_tB-Hc05ecsVdJmDSjPOm6A_TOMZPMhl"
);

let envelopes = [];
let selectedBox = null;

/* ===== LOAD BAO ===== */
async function loadBoxes(){
    const { data, error } = await sb
        .from("lixi_boxes")
        .select("*")
        .eq("opened", false);

    if(error){
        console.error(error);
        return;
    }

    envelopes = data;
    render();
}
loadBoxes();

/* ===== RENDER ===== */
function render(){
    const wrap = document.getElementById("envelopes");
    wrap.innerHTML = "";

    envelopes.forEach(box=>{
        const div = document.createElement("div");
        div.className = "envelope";
        div.innerHTML = `
            <div class="lixi-text small">Chúc bạn</div>
            <div class="lixi-text big">MAY MẮN</div>`;
        div.onclick = ()=>openEnvelope(box,div);
        wrap.appendChild(div);
    });

    document.getElementById("count").innerText = envelopes.length;
}

/* ===== MỞ BAO ===== */
function openEnvelope(box,el){
    selectedBox = box;
    el.classList.add("opened");

    setTimeout(()=>{
        document.getElementById("rewardText").innerText =
            `🎉 Bạn nhận được ${box.amount.toLocaleString()}đ`;
        document.getElementById("modal").classList.add("show");
    },400);
}

/* ===== XÁC NHẬN ===== */
async function confirmOpen(){
    const name = document.getElementById("nameInput").value || "Ẩn danh";

    await sb.from("lixi_boxes")
        .update({
            opened:true,
            opened_by:name,
            opened_at:new Date()
        })
        .eq("id",selectedBox.id);

    document.getElementById("modal").classList.remove("show");
    document.getElementById("nameInput").value = "";

    const h = document.createElement("div");
    h.className="history-item";
    h.innerHTML=`<b>${name}</b> nhận ${selectedBox.amount.toLocaleString()}đ`;
    document.getElementById("historyList").prepend(h);

    loadBoxes();
}

/* ===== PHÁO HOA ===== */
const canvas=document.getElementById("fireworks"),ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener("resize",resize);
let ps=[];
setInterval(()=>{
    let x=Math.random()*canvas.width,y=Math.random()*canvas.height*.4;
    for(let i=0;i<40;i++)
        ps.push({x,y,vx:Math.cos(i)*3,vy:Math.sin(i)*3,a:1})
},900);
(function anim(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ps.forEach((p,i)=>{
        p.x+=p.vx;p.y+=p.vy;p.a-=.015;
        ctx.globalAlpha=p.a;
        ctx.fillStyle="#ffd966";
        ctx.beginPath();ctx.arc(p.x,p.y,2,0,7);ctx.fill();
        if(p.a<=0)ps.splice(i,1)
    });
    ctx.globalAlpha=1;
    requestAnimationFrame(anim)
})();
</script>
</body>
</html>
